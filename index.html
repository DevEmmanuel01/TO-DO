<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Dashboard</title>
    <meta name="description" content="A simple and elegant to-do dashboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <div class="logo-container">
                <svg aria-hidden="true" class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <h1>My Tasks</h1>
            </div>
            <p class="subtitle" id="date-display">Today</p>
        </header>

        <main>
            <div class="stats-card" aria-live="polite">
            <div class="stat">
                <span class="stat-value" id="total-tasks">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="completed-tasks">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="pending-tasks">0</span>
                <span class="stat-label">Pending</span>
            </div>
        </div>

            <form id="todo-form" class="todo-form">
                <div class="input-wrapper">
                    <input type="text" id="todo-input" class="todo-input" placeholder="What needs to be done?" autocomplete="off">
                    <button type="submit" class="add-button" id="add-button" disabled>Add</button>
                </div>
                <div id="error-message" class="error-message" aria-live="polite"></div>
            </form>

            <nav class="filters" aria-label="Task filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </nav>

            <div class="todo-list-container">
                <ul id="todo-list" class="todo-list">
                    <!-- Todo items will be dynamically added here -->
                </ul>
            </div>
            
            <div class="footer-actions">
                <button id="clear-completed" class="clear-button">Clear Completed</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
